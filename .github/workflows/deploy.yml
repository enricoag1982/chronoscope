name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these; nothing else in the repository does.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it, so a deploy is never half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests gate the deploy. A green page that lies about its own
      # correctness claims would be worse than no page.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
